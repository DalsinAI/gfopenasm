name: gfasm (build with gcc and clang, test corpus)

# The check every pull request has to pass, in the GitHub Actions workflow
# format: build gfasm with gcc and with clang with warnings as errors, run the
# test corpus and check that the test scripts parse.  It needs nothing but an
# ubuntu:24.04 container; see CONTRIBUTING.md for running it by hand.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gfasm:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 20
    steps:
      - name: Base packages
        run: apt-get update && apt-get install -y --no-install-recommends build-essential clang python3 ca-certificates git
      - uses: actions/checkout@v4
      - name: Build with gcc (warnings are errors)
        run: make clean && make CFLAGS="-O2 -std=c11 -Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Build with clang (warnings are errors)
        run: make clean && make CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Test corpus (byte for byte against the stored vasm 2.0f output)
        run: make test
      - name: Scripts parse
        run: |
          for f in tests/*.sh tests/gen/*.sh; do sh -n "$f"; done
          python3 -m py_compile tests/*.py tests/gen/*.py
